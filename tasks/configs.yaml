# global configs
embedding_model: sentence-transformers/all-MiniLM-L6-v2

# env configs
alfworld:
  env_config_path: tasks/env_configs/alfworld_config.yaml 
  max_steps: 30
  few_shots_num: 1

sciworld:
  env_config_path: tasks/env_configs/sciworld_config.yaml
  max_steps: 30
  few_shots_num: 0

fever:
  env_config_path: tasks/env_configs/fever_config.yaml
  max_steps: 30
  few_shots_num: 3

pddl:
  env_config_path: tasks/env_configs/pddl_config.yaml
  max_steps: 30
  few_shots_num: 1

# MAS configs
#
# build_task looks these blocks up by --mas_type, so a block only takes effect if
# its name is one of that flag's choices. `graph` is MacNet's and is not read -
# MacNet's mas_type is `macnet`, and its in-code defaults disagree with the values
# here. autogen_mas has no block and takes every default. Both are tracked in
# docs/BACKLOG.md; MacNet and DyLAN are out of use.
autogen:
  autogen:  True

graph:
  graph_type: Random
  node_num: 3
  use_critic: False

dylan:
  node_num: 2
  round_num: 2
  learning_rate: 0.01
  use_critic: False
