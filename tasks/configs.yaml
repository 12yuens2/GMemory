# global configs
embedding_model: sentence-transformers/all-MiniLM-L6-v2
# Keep this off the GPUs: on a node serving vLLM they are all the server's.
embedding_device: cpu

# env configs
alfworld:
  env_config_path: tasks/env_configs/alfworld_config.yaml 
  max_steps: 30
  few_shots_num: 1

sciworld:
  env_config_path: tasks/env_configs/sciworld_config.yaml
  max_steps: 30
  few_shots_num: 0

fever:
  env_config_path: tasks/env_configs/fever_config.yaml
  max_steps: 30
  few_shots_num: 3
  max_tasks: 200

pddl:
  env_config_path: tasks/env_configs/pddl_config.yaml
  max_steps: 30
  few_shots_num: 1

# MAS configs. Looked up by --mas_type, so `graph` below is never read: MacNet's
# mas_type is `macnet`.
autogen:
  autogen:  True
  use_validator: False

graph:
  graph_type: Random
  node_num: 3
  use_critic: False

dylan:
  node_num: 2
  round_num: 2
  learning_rate: 0.01
  use_critic: False
