name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Only the dev group. The project's main dependency set pins torch and the
      # full nvidia CUDA wheel set, none of which the offline suite touches -
      # this env is ~75MB and installs in seconds.
      - name: Install dev dependencies
        run: uv sync --only-group dev

      - name: Lint
        run: uv run --only-group dev ruff check .

      # Excludes the `network` marker by default (see addopts in pyproject.toml),
      # so no LLM credentials are needed.
      #
      # NOTE: this currently takes ~7.5 minutes for 115 fully-mocked tests.
      # Almost all of it is the two hardcoded `time.sleep(5)` calls in
      # autogen_mas.py (~9s x 48 parametrised cases). Removing them is Phase 4;
      # doing it earlier would bring this job under a minute.
      - name: Test
        run: uv run --only-group dev pytest
