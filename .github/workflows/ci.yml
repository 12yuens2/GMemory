name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Dev group only - the main dependency set pins torch and CUDA.
      - name: Install dev dependencies
        run: uv sync --only-group dev

      - name: Lint
        run: uv run --only-group dev ruff check .

      # Network tests are excluded by default, so no credentials are needed.
      # Takes ~7.5min, almost entirely the two time.sleep(5) calls in autogen_mas.py.
      - name: Test
        run: uv run --only-group dev pytest
